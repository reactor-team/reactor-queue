# Run the unit test suite on every pull request and every push to main.
# These are fast, hermetic unit tests (no network, no PartyKit/Reactor) that
# exercise the queue protocol, client/admin state machines, the PartyKit server
# engine against an in-memory room, and the Coordinator REST client.

name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
